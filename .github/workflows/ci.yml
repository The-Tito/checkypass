name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run guard
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verificar que dist/index.html no tiene scripts ni estilos inline
        run: |
          if grep -nE '<script>|<script [^>]*>' dist/index.html | grep -v 'src='; then
            echo "Hay <script> inline en dist/index.html"; exit 1
          fi
          if grep -n '<style' dist/index.html; then
            echo "Hay <style> inline en dist/index.html"; exit 1
          fi
